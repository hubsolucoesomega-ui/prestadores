<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel ADM · Soluções Omega</title>
<style>
  :root { --primary:#0f3a66; --primary-deep:#0b2a4a; --foreground:#13294b; --muted:#6b7a90; --border:#d5dbe5; --bg:#f4f6fa; --danger:#b42318; --ok:#067647; --warn:#b54708; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; font-size:14px; color:var(--foreground); background:var(--bg); }
  header { background:var(--primary-deep); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  header strong { font-size:15px; }
  main { padding:16px; max-width:1100px; margin:0 auto; }
  .nav-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; border-bottom:2px solid var(--border); padding-bottom:8px; }
  .nav-tabs button { border:none; background:none; padding:7px 14px; font:inherit; font-size:14px; cursor:pointer; border-radius:6px 6px 0 0; color:var(--muted); }
  .nav-tabs button[aria-selected="true"] { background:var(--primary); color:#fff; }
  .tab-pane { display:none; }
  .tab-pane.active { display:block; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .tabs button { border:1px solid var(--border); background:#fff; border-radius:999px; padding:6px 12px; font:inherit; cursor:pointer; }
  .tabs button[aria-pressed="true"] { background:var(--primary); color:#fff; border-color:var(--primary); }
  .layout { display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:900px){ .layout { grid-template-columns: 1fr 1fr; } }
  .panel { background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px; }
  .item { display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; font:inherit; cursor:pointer; }
  .item:hover, .item[aria-current="true"] { border-color:var(--primary); }
  .item strong { display:block; font-size:14px; }
  .item span { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; margin-left:6px; }
  .s-pending { background:#fef0c7; color:var(--warn); }
  .s-approved { background:#dcfae6; color:var(--ok); }
  .s-rejected { background:#fee4e2; color:var(--danger); }
  dl { display:grid; grid-template-columns: 140px 1fr; gap:6px 10px; margin:0; font-size:13px; }
  dt { color:var(--muted); }
  dd { margin:0; word-break:break-word; }
  .actions { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .actions button { height:38px; padding:0 14px; border-radius:6px; border:1px solid var(--primary); background:#fff; color:var(--primary); font:inherit; font-weight:700; cursor:pointer; }
  .actions .approve { background:var(--primary); color:#fff; }
  .actions .reject { border-color:var(--danger); color:var(--danger); }
  .empty { color:var(--muted); padding:20px; text-align:center; }
  .login { max-width:340px; margin:60px auto; background:#fff; border:1px solid var(--border); border-radius:10px; padding:18px; }
  .login input { width:100%; height:40px; border:1px solid #c5ccd8; border-radius:6px; padding:0 10px; font:inherit; margin:6px 0 10px; }
  .login button { width:100%; height:40px; border:0; border-radius:6px; background:var(--primary); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  .msg { color:var(--danger); font-size:13px; min-height:18px; }
  .docs li { margin:4px 0; }
  .hidden { display:none !important; }
  /* ---- Banners ---- */
  .bn-form { background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .bn-form h3 { margin:0 0 12px; font-size:15px; }
  .bn-field { margin-bottom:10px; }
  .bn-field label { display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:var(--muted); }
  .bn-field input[type=text], .bn-field input[type=url] { width:100%; height:38px; border:1px solid var(--border); border-radius:6px; padding:0 10px; font:inherit; }
  .bn-field input[type=file] { width:100%; font:inherit; }
  .bn-field textarea { width:100%; border:1px solid var(--border); border-radius:6px; padding:8px 10px; font:inherit; resize:vertical; }
  .bn-btn { height:38px; padding:0 16px; border-radius:6px; border:0; background:var(--primary); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  .bn-btn-sec { background:#fff; border:1px solid var(--border); color:var(--foreground); }
  .bn-list { }
  .bn-card { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; }
  .bn-thumb { width:80px; height:48px; object-fit:cover; border-radius:4px; flex-shrink:0; background:#eee; }
  .bn-thumb-vid { width:80px; height:48px; border-radius:4px; flex-shrink:0; background:#1a1a2e; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; }
  .bn-info { flex:1; min-width:0; }
  .bn-info strong { display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bn-info span { font-size:11px; color:var(--muted); }
  .bn-btns { display:flex; flex-direction:column; gap:4px; }
  .bn-btns button { height:28px; padding:0 8px; border-radius:4px; border:1px solid var(--border); background:#fff; font:inherit; font-size:12px; cursor:pointer; white-space:nowrap; }
  .bn-btns .del-btn { border-color:var(--danger); color:var(--danger); }
  #bn-preview-wrap { margin-top:10px; display:none; }
  #bn-preview-img { max-width:100%; max-height:140px; border-radius:6px; border:1px solid var(--border); }
  #bn-preview-vid { max-width:100%; max-height:140px; border-radius:6px; border:1px solid var(--border); }
</style>
</head>
<body>
<header>
  <img src="assets/img/logo-solucoes-omega.png" alt="Soluções Omega" style="height:32px;width:auto;background:#fff;border-radius:6px;padding:3px 8px;vertical-align:middle;margin-right:10px"><strong>Painel ADM</strong>
  <button id="logout" class="hidden" style="background:none;border:1px solid #fff;color:#fff;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer">Sair</button>
</header>

<main>
  <section id="app">
    <!-- Abas principais -->
    <div class="nav-tabs" role="tablist" aria-label="Seções do painel">
      <button role="tab" aria-selected="true"  aria-controls="tab-cadastros" id="btn-tab-cadastros">Cadastros</button>
      <button role="tab" aria-selected="false" aria-controls="tab-banners"   id="btn-tab-banners">🖼 Banners</button>
    </div>

    <!-- ABA: Cadastros -->
    <div id="tab-cadastros" class="tab-pane active" role="tabpanel" aria-labelledby="btn-tab-cadastros">
      <div class="tabs" role="group" aria-label="Filtrar por status">
        <button type="button" data-f="pending" aria-pressed="true">Pendentes <span id="c-pending"></span></button>
        <button type="button" data-f="approved" aria-pressed="false">Aprovados <span id="c-approved"></span></button>
        <button type="button" data-f="rejected" aria-pressed="false">Reprovados <span id="c-rejected"></span></button>
        <button type="button" data-f="all" aria-pressed="false">Todos</button>
      </div>
      <div class="layout">
        <div class="panel" id="list-panel"><div id="list"></div></div>
        <div class="panel" id="detail-panel"><div class="empty" id="detail">Selecione um cadastro na lista.</div></div>
      </div>
    </div>

    <!-- ABA: Banners -->
    <div id="tab-banners" class="tab-pane" role="tabpanel" aria-labelledby="btn-tab-banners">
      <div class="bn-form">
        <h3>Adicionar banner</h3>
        <div class="bn-field">
          <label>Arquivo (imagem JPG/PNG/WebP ou vídeo MP4)</label>
          <input type="file" id="bn-file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm">
        </div>
        <div id="bn-preview-wrap">
          <img id="bn-preview-img" src="" alt="Preview" style="display:none">
          <video id="bn-preview-vid" src="" muted loop style="display:none"></video>
        </div>
        <div class="bn-field">
          <label>Título interno (referência)</label>
          <input type="text" id="bn-title" placeholder="Ex: Banner Serviços – Junho">
        </div>
        <div class="bn-field">
          <label>Olho (linha pequena acima do título)</label>
          <input type="text" id="bn-eyebrow" placeholder="Ex: Serviços para sua casa">
        </div>
        <div class="bn-field">
          <label>Título principal (H1)</label>
          <input type="text" id="bn-headline" placeholder="Ex: Profissionais certos.">
        </div>
        <div class="bn-field">
          <label>Subtítulo</label>
          <textarea id="bn-sub" rows="2" placeholder="Descrição curta exibida no banner"></textarea>
        </div>
        <div class="bn-field">
          <label>Texto do botão CTA</label>
          <input type="text" id="bn-cta-text" placeholder="Ex: Ver serviços">
        </div>
        <div class="bn-field">
          <label>Link do botão CTA</label>
          <input type="url" id="bn-cta-link" placeholder="Ex: #catalogo ou https://...">
        </div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="bn-btn" id="bn-add">Adicionar banner</button>
          <span id="bn-msg" style="align-self:center;font-size:13px;color:var(--ok)"></span>
        </div>
      </div>

      <div class="panel">
        <h3 style="margin:0 0 12px;font-size:15px">Banners ativos <span id="bn-count" style="color:var(--muted);font-weight:normal;font-size:13px"></span></h3>
        <p style="font-size:12px;color:var(--muted);margin:0 0 10px">Arraste para reordenar, ou use os botões ↑ ↓. As alterações são salvas automaticamente.</p>
        <div id="bn-list" class="bn-list"></div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="bn-btn bn-btn-sec" id="bn-reset">Restaurar banners padrão</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/admin.js"></script>
<script>
/* ========= Navegação entre abas ========= */
(function(){
  var tabs = document.querySelectorAll('.nav-tabs [role=tab]');
  tabs.forEach(function(btn){
    btn.addEventListener('click', function(){
      tabs.forEach(function(b){
        b.setAttribute('aria-selected','false');
        document.getElementById(b.getAttribute('aria-controls')).classList.remove('active');
      });
      btn.setAttribute('aria-selected','true');
      document.getElementById(btn.getAttribute('aria-controls')).classList.add('active');
    });
  });
})();

/* ========= Gerenciador de Banners ========= */
(function(){
  var STORAGE_KEY = 'omega_banners';
  var fileData = null; // {type, src}

  function load(){
    try{ var s=localStorage.getItem(STORAGE_KEY); if(s) return JSON.parse(s); }catch(e){}
    return null; // null = usar padrão do site
  }
  function save(arr){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }catch(e){ alert('Erro ao salvar: '+e.message); } }
  function getList(){ return load() || []; }

  function render(){
    var arr = getList();
    var el = document.getElementById('bn-list');
    document.getElementById('bn-count').textContent = '('+arr.length+')';
    if(!arr.length){ el.innerHTML='<p style="color:var(--muted);padding:16px 0;text-align:center">Nenhum banner adicionado. Os banners padrão do site estão sendo exibidos.</p>'; return; }
    el.innerHTML='';
    arr.forEach(function(b,i){
      var card = document.createElement('div');
      card.className='bn-card';
      card.setAttribute('draggable','true');
      card.dataset.i = i;
      var thumb;
      if(b.type==='video'){
        thumb = '<div class="bn-thumb-vid">▶</div>';
      } else {
        thumb = '<img class="bn-thumb" src="'+b.src+'" alt="">';
      }
      card.innerHTML = thumb +
        '<div class="bn-info"><strong>'+(b.title||b.headline||'Banner '+(i+1))+'</strong><span>'+(b.type==='video'?'📹 Vídeo':'🖼 Imagem')+(b.ctaText?' · CTA: '+b.ctaText:'')+'</span></div>'+
        '<div class="bn-btns">'+
          '<button data-action="up" data-i="'+i+'" title="Mover para cima">↑</button>'+
          '<button data-action="down" data-i="'+i+'" title="Mover para baixo">↓</button>'+
          '<button data-action="del" data-i="'+i+'" class="del-btn" title="Remover">✕</button>'+
        '</div>';
      el.appendChild(card);
    });

    // Botões
    el.querySelectorAll('[data-action]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var action = btn.dataset.action;
        var idx = parseInt(btn.dataset.i);
        var arr2 = getList();
        if(action==='del'){ if(!confirm('Remover banner?')) return; arr2.splice(idx,1); }
        else if(action==='up' && idx>0){ var t=arr2[idx]; arr2[idx]=arr2[idx-1]; arr2[idx-1]=t; }
        else if(action==='down' && idx<arr2.length-1){ var t2=arr2[idx]; arr2[idx]=arr2[idx+1]; arr2[idx+1]=t2; }
        save(arr2); render();
      });
    });

    // Drag-and-drop reorder
    var dragIdx=null;
    el.querySelectorAll('.bn-card').forEach(function(card){
      card.addEventListener('dragstart',function(){ dragIdx=parseInt(card.dataset.i); card.style.opacity='.5'; });
      card.addEventListener('dragend',function(){ card.style.opacity=''; });
      card.addEventListener('dragover',function(e){ e.preventDefault(); card.style.background='#f0f4ff'; });
      card.addEventListener('dragleave',function(){ card.style.background=''; });
      card.addEventListener('drop',function(e){
        e.preventDefault(); card.style.background='';
        var toIdx=parseInt(card.dataset.i);
        if(dragIdx===null||dragIdx===toIdx) return;
        var arr3=getList();
        var item=arr3.splice(dragIdx,1)[0];
        arr3.splice(toIdx,0,item);
        save(arr3); render();
      });
    });
  }

  // Preview ao selecionar arquivo
  document.getElementById('bn-file').addEventListener('change', function(){
    var file = this.files[0];
    if(!file){ fileData=null; return; }
    var previewWrap = document.getElementById('bn-preview-wrap');
    var previewImg = document.getElementById('bn-preview-img');
    var previewVid = document.getElementById('bn-preview-vid');
    previewWrap.style.display='block';
    var reader = new FileReader();
    reader.onload = function(e){
      var src = e.target.result;
      var isVideo = file.type.startsWith('video/');
      fileData = { type: isVideo?'video':'image', src: src };
      if(isVideo){
        previewImg.style.display='none';
        previewVid.style.display='block';
        previewVid.src=src;
      } else {
        previewVid.style.display='none';
        previewImg.style.display='block';
        previewImg.src=src;
      }
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('bn-add').addEventListener('click', function(){
    if(!fileData){ alert('Selecione uma imagem ou vídeo primeiro.'); return; }
    var title    = document.getElementById('bn-title').value.trim();
    var eyebrow  = document.getElementById('bn-eyebrow').value.trim();
    var headline = document.getElementById('bn-headline').value.trim();
    var sub      = document.getElementById('bn-sub').value.trim();
    var ctaText  = document.getElementById('bn-cta-text').value.trim();
    var ctaLink  = document.getElementById('bn-cta-link').value.trim();
    var arr = getList();
    arr.push({ type:fileData.type, src:fileData.src, title:title, eyebrow:eyebrow, headline:headline, sub:sub, ctaText:ctaText, ctaLink:ctaLink });
    save(arr);
    // Reset form
    ['bn-title','bn-eyebrow','bn-headline','bn-sub','bn-cta-text','bn-cta-link'].forEach(function(id){ document.getElementById(id).value=''; });
    document.getElementById('bn-file').value='';
    document.getElementById('bn-preview-wrap').style.display='none';
    document.getElementById('bn-preview-img').src='';
    document.getElementById('bn-preview-vid').src='';
    fileData=null;
    document.getElementById('bn-msg').textContent='✓ Banner adicionado!';
    setTimeout(function(){ document.getElementById('bn-msg').textContent=''; },3000);
    render();
  });

  document.getElementById('bn-reset').addEventListener('click', function(){
    if(!confirm('Remover todos os banners e restaurar os padrão do site?')) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    render();
  });

  render();
})();
</script>
</body>
</html>
